[workspace]

[package]
name = "helius-narsil-bench"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

[features]
default = ["ark-asm"]
# The arkworks lane pair. The same code serves both; the built binary's
# regime decides which lane name it may answer for.
ark-asm = ["ark-ff/asm"]
force-portable = ["helius-narsil/force-portable"]

[dependencies]
ark-bn254 = "=0.5.0"
ark-ec = "=0.5.0"
ark-ff = "=0.5.0"
ark-groth16 = { version = "=0.5.0", default-features = false, features = ["std"] }
helius-narsil = { path = "..", features = ["std", "backend-report"] }
rand = "=0.8.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
criterion = "0.5"

[build-dependencies]
cc = "1"
sha2 = "0.10"

# Gate A's second harness. It shares the lane adapters with the runner, so both
# harnesses time one body.
[[bench]]
name = "anchors"
harness = false

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
